{% extends "base.html" %}
{% block title %}Users &middot; ACEest Fitness{% endblock %}

{% block content %}
<section class="split">
  <div class="card">
    <h2>Staff accounts</h2>
    <table class="roster">
      <thead><tr><th>Username</th><th>Role</th><th>Created</th></tr></thead>
      <tbody>
        {% for user in users %}
          <tr><td>{{ user.username }}</td><td>{{ user.role }}</td><td>{{ user.created_at }}</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  <div class="card">
    <h2>Add a user</h2>
    <form method="post" action="{{ url_for('auth.add_user') }}" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Username <input type="text" name="username" required maxlength="32"></label>
      <label>Password <input type="password" name="password" required minlength="10" autocomplete="new-password"></label>
      <label>Role
        <select name="role"><option>Coach</option><option>Admin</option></select>
      </label>
      <button type="submit">Create user</button>
    </form>
  </div>
</section>
{% endblock %}
