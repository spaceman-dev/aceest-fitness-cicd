# Jenkins deploys with this service account. It can manage workloads in the
# five app namespaces and nothing else - no cluster-wide rights, no RBAC edits.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: aceest-ci
---
# long-lived token for the kubeconfig stored in Jenkins credentials
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-deployer-token
  namespace: aceest-ci
  annotations:
    kubernetes.io/service-account.name: jenkins-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aceest-deployer
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
