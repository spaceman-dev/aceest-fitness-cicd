# Jenkins Configuration as Code for the ACEest build server.
# Secrets are read from files mounted at /run/secrets (see infra/README.md);
# nothing sensitive lives in this file.
jenkins:
  systemMessage: "ACEest Fitness & Gym - build server (configured from infra/jenkins/casc.yaml)"
  numExecutors: 3
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          name: "Jenkins Admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  globalNodeProperties:
    - envVars:
        env:
          - key: "ACEEST_IMAGE_REPO"
            value: "${ACEEST_IMAGE_REPO:-192.168.89.10:5000/aceest-fitness}"
          - key: "ACEEST_REGISTRY_CREDENTIALS"
            value: "${ACEEST_REGISTRY_CREDENTIALS:-}"
          - key: "ACEEST_INGRESS"
            value: "${ACEEST_INGRESS:-http://192.168.89.2}"
          - key: "ACEEST_DOCKER_NETWORK"
            value: "aceest-net"

unclassified:
  location:
    url: "http://localhost:8090/"
  sonarGlobalConfiguration:
    buildWrapperEnabled: false
    installations:
      - name: "sonarqube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonar-token"
              description: "SonarQube analysis token"
              secret: "${SONAR_TOKEN}"
          - file:
              scope: GLOBAL
              id: "kubeconfig-aceest"
              description: "kubeconfig for the jenkins-deployer service account"
              fileName: "kubeconfig"
              secretBytes: "${readFileBase64:/run/secrets/kubeconfig}"
          # only used when ACEEST_REGISTRY_CREDENTIALS=registry (e.g. Docker Hub)
          - usernamePassword:
              scope: GLOBAL
              id: "registry"
              description: "Container registry login"
              username: "${REGISTRY_USER:-}"
              password: "${REGISTRY_PASSWORD:-}"

jobs:
  - script: |
      multibranchPipelineJob('aceest-fitness-cicd') {
        displayName('ACEest Fitness CI/CD')
        description('Lint, test, SonarQube gate, image build and Kubernetes rollout for every branch and release tag.')
        branchSources {
          branchSource {
            source {
              git {
                id('aceest-fitness-cicd')
                remote('${ACEEST_REPO_URL:-https://github.com/spaceman-dev/aceest-fitness-cicd.git}')
                traits {
                  gitBranchDiscovery()
                  gitTagDiscovery()
                }
              }
            }
            buildStrategies {
              buildRegularBranches()
              buildTags {
                atLeastDays('-1')
                atMostDays('7')
              }
            }
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
        triggers {
          periodicFolderTrigger {
            interval('2m')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(10)
          }
        }
      }

      pipelineJob('aceest-rollback') {
        displayName('ACEest Rollback')
        description('Manually revert one release lane to its previous version, its standby slot or a chosen image.')
        parameters {
          choiceParam('STRATEGY', ['rolling', 'blue-green', 'canary', 'ab-testing', 'shadow'], 'Release lane to roll back')
          stringParam('TARGET_IMAGE', '', 'Optional image to restore; empty = previous revision / standby slot / end the experiment')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('${ACEEST_REPO_URL:-https://github.com/spaceman-dev/aceest-fitness-cicd.git}')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile.rollback')
            lightweight(true)
          }
        }
      }
