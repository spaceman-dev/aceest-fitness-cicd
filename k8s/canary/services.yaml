apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aceest-data
  namespace: aceest-canary
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-stable
  namespace: aceest-canary
  labels:
    app: aceest
spec:
  selector:
    app: aceest
    track: stable
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary
  namespace: aceest-canary
  labels:
    app: aceest
spec:
  selector:
    app: aceest
    track: canary
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest
  namespace: aceest-canary
spec:
  ingressClassName: nginx
  rules:
    - host: canary.aceest.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-stable
                port:
                  name: http
