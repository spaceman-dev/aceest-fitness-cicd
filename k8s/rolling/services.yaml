apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aceest-data
  namespace: aceest-rolling
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aceest
  namespace: aceest-rolling
  labels:
    app: aceest
spec:
  selector:
    app: aceest
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest
  namespace: aceest-rolling
spec:
  ingressClassName: nginx
  rules:
    - host: rolling.aceest.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest
                port:
                  name: http
