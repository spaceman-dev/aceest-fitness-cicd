apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aceest-data
  namespace: aceest-bluegreen
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
# bluegreen.aceest.localhost is the strategy's own URL; aceest.localhost is the
# main "production" entry point and follows the same live slot.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest
  namespace: aceest-bluegreen
spec:
  ingressClassName: nginx
  rules:
    - host: bluegreen.aceest.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest
                port:
                  name: http
    - host: aceest.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest
                port:
                  name: http
    - host: preview.bluegreen.aceest.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-preview
                port:
                  name: http
