# A/B testing: two variants side by side. Routing is decided per user segment
# (header/cookie, see ingress-variant-b.yaml), not by a random percentage, so a
# user always sees the same variant for the whole experiment.
# ${VARIANT} is a or b.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-${VARIANT}
  namespace: aceest-ab
  labels:
    app: aceest
    variant: ${VARIANT}
  annotations:
    kubernetes.io/change-cause: "${CHANGE_CAUSE}"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: aceest
      variant: ${VARIANT}
  template:
    metadata:
      labels:
        app: aceest
        variant: ${VARIANT}
        version: "${VERSION}"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: ACEEST_TRACK
              value: variant-${VARIANT}
            - name: ACEEST_DB
              value: /data/aceest.db
            - name: ACEEST_FAULT
              value: "${FAULT}"
          envFrom:
            - secretRef:
                name: aceest-app
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aceest-data
        - name: tmp
          emptyDir: {}
